services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lealink
      POSTGRES_PASSWORD: lealink
      POSTGRES_DB: lealink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lealink"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: src/saas
    ports:
      - "5001:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://lealink:lealink@postgres:5432/lealink
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/saas:/app

  edge:
    build:
      context: .
      dockerfile: docker/Dockerfile.edge
    # Para desplegar en Raspberry Pi 4/5 (ARM64), añadir:
    #   platform: linux/arm64
    # o construir con:
    #   docker buildx build --platform linux/arm64 -f docker/Dockerfile.edge -t energycomm-edge:arm64 .
    environment:
      - FEED_MODE=simulado
      - N_STEPS=8760        # 1 año completo (365 días × 24 h) ≈ 6-7 min
      - START_STEP=5137     # dataset row 5137 = 2022-01-01 → estaciones alineadas
      - START_DATE=2025-01-01  # step 0 = 2025-01-01 00:00 UTC
      - SAAS_API_URL=http://web:5000
      - EDGE_API_KEY=lealink-edge-secret
      - COMUNIDAD_ID=1
    depends_on:
      web:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
